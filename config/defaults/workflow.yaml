# Shipped defaults: cross-cutting workflow knobs (design.md pieces 1/2/5 +
# coverage decisions). Users override in .claude/context/workflow.yaml.

# Reviewer-rejection circuit breaker (coverage B3): beyond max, the
# in-review -> in-progress rework transition is refused and the human is
# escalated — "round N+ signals plan drift, not code drift".
review_rounds:
  max: 5

# Stalled-agent procedure (coverage B4): the post-spawn capture hook detects
# a missing status block (`missing-status-block`; a reviewer reply whose
# engine-read verdict was still captured logs `status-block-malformed`
# instead — flagged, NOT a stall); never act on the agent's behalf;
# re-invoke with a continuation prompt; bounded retries then escalate.
stall:
  recovery_after: 2
  human_after: 3

# Repo-map staleness (design.md piece 5B): refresh when missing or more than
# N commits behind the SHA it was generated at.
repo_map:
  stale_after_commits: 50

# The mode a work item lands on when it carries no `Mode:` hint of its own:
# `full` (three unconditional human gates) or `lean` (exception-based
# gating — the plan gate fires only when the plan-review panel exhausted
# its round budget; approve-impl absent; one guaranteed human stop at
# pre-PR). Quick is deliberately NOT defaultable: it needs per-item
# eligibility (explicit hint + no disqualifying keyword), never a standing
# workspace choice. A single item can still override in ANY direction with
# `Mode: full` / `Mode: lean` / `Mode: quick` in its description — an
# explicit full hint outranks everything (more gating is always grantable).
default_mode: full

# Adversarial plan review: the lens panel the plan-review step runs BEFORE
# its synthesizer. Each entry spawns one reviewer in `plan-attack` mode with
# that lens's hunt (steps/plan-attack-task.md defines the lens vocabulary);
# the synthesizer (mode plan-review) reads the lens reports and issues THE
# verdict — lens verdicts are advisory evidence, never read by the engine
# (verdict_bound filters on mode plan-review), so panel size can't burn the
# round budget. An EMPTY list is the declared single-reviewer fallback: no
# lenses, the synthesizer reviews the plan directly.
plan_review:
  lenses: [contradictions, gaps]
  # Per-change_type panel override (field 459226 rec: lean ran the full
  # adversarial panel, full round budget, for an all-low-risk chore). An
  # UNMAPPED change_type gets the default panel above — fail toward MORE
  # review, never less; a mapped EMPTY list is the single-reviewer
  # fallback. Resolve via `harness resolve-lenses --run <run>` — the one
  # control point — never hand-derive from these files. NOTE on
  # overriding: config merges DEEP, so a workspace override of `lenses`
  # alone keeps this mapping (chore/docs stay single-reviewer); to run
  # the full panel for every change_type set
  # `lenses_by_change_type: null` (an empty `{}` merges to no change),
  # or re-map individual keys.
  lenses_by_change_type:
    chore: []
    docs: []

# Severity model for the security step + conditional gate predicate.
security:
  severity_order: [info, low, medium, high, critical]
  gate_threshold: medium

# Work-item tags written at workflow milestones (extension example from the
# modularity section). Empty by default; e.g. `on_develop_start: in-development`.
tags: {}

# Test-set identification for the TDD proof (design.md piece 5A + RC4).
# `test_cmd` itself is DISCOVERED per repo by init-workspace, never defaulted.
# test_paths: which changed files count as the red test-set. Also the write
#   surface the test-first ordering guard allows BEFORE a task's red-proof is
#   sealed — so the defaults must cover the mainstream layouts (field report:
#   the Python/JS-only defaults would have stranded a Maven developer at the
#   first `src/test/**` write).
# test_closure: existing files SHA-locked WITH the tests (fixtures/config —
# the RC4 widening: weakening a shared fixture must not evade the lock).
# pre_red_paths: additionally writable before the red-proof is sealed — build
#   manifests a failing test's new dependency lands in. Deliberately NOT
#   test_closure: closure files are SHA-locked at red, and a post-red
#   implementation-dependency edit to pom.xml must stay legal.
language:
  test_paths: ["tests/**", "**/test_*.py", "**/*_test.*", "**/*.test.*",
               "**/*.spec.*", "src/test/**", "**/*Test.java", "**/*Tests.java",
               "**/__tests__/**"]
  test_closure: ["**/conftest.py", "pytest.ini", "tests/**", "src/test/**"]
  pre_red_paths: ["**/pom.xml", "**/build.gradle", "**/build.gradle.kts",
                  "**/settings.gradle", "**/settings.gradle.kts",
                  "**/package.json", "**/*.csproj", "pyproject.toml",
                  "setup.py", "setup.cfg", "requirements*.txt", "go.mod",
                  "go.sum", "Cargo.toml", "Gemfile", "composer.json"]
# Per-repo entries live under `language.repos.<name>` (test_cmd, coverage_cmd,
# quarantine) and are written at /init-workspace or /workspace-config, never
# shipped as defaults — there is no sensible default test command. The
# `quarantine` shape, for a KNOWN-FAILING spec unrelated to any run (field:
# dual-run comparison — one pre-existing failure was rediscovered and
# hand-routed-around four times across two runs of the same story, because
# the per-call `--test-cmd` override could express the workaround but nothing
# carried it between runs). init-verify refuses a malformed block:
#
#   language:
#     repos:
#       frontend:
#         test_cmd: "npx vitest run"
#         quarantine:
#           # rendered once per entry and APPENDED, so the command must be a
#           # single one (no &&/|) and the flag must reach the RUNNER — an
#           # `npm test` wrapper needs "-- --exclude {test}" to pass it on
#           exclude_template: "--exclude {test}"
#           # optional, and only when coverage is a DIFFERENT tool from the
#           # test runner (mvn test vs mvn jacoco:report, vitest vs nyc);
#           # defaults to exclude_template
#           coverage_exclude_template: "--exclude {test}"
#           tests:
#             # reason + since are REQUIRED: quarantine is never casual or
#             # undated, and every run flags the exclusions it applied
#             - test: "tests/harden-fe010.spec.ts"
#               reason: "pre-existing appVersion mismatch, fails on main"
#               since: "2026-07-22"
