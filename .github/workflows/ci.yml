# CI matrix — the suite, schema validation, and the line-budget/duplication
# sweep on every PR. All three OS lanes are enforcing. The Windows lane
# had its first real triage in 2026-07 (290 -> 0 failures): the blind-written
# msvcrt/9009/harness.cmd assumptions were replaced with measured behavior,
# fake-CLI stubs became real PE launchers (tests/support.py), and the guard
# layer grew nt-scoped path handling — see CHANGELOG [3.0.3].
name: ci

# PRs plus `main` only, deliberately narrow. A bare `push:` (every push,
# every branch) ran the whole matrix a SECOND time for any push to a branch
# with an open PR — 6 jobs billed as 12, both reporting the same tree.
#
# No `types:` filter: the default (opened + synchronize + reopened) is
# load-bearing, not incidental. `synchronize` is what re-tests commits
# pushed to an already-open PR — without it, a green check could describe
# the tree at PR-open time while a later commit rode into the merge
# untested (this repo's releases push doc/fix commits after opening the
# PR; that is exactly the case).
on:
  pull_request:

  # `main` itself, post-merge. Releases squash-merge, so this is ONE push per
  # release — one extra matrix run, not the every-branch double-billing above.
  # It is also the only way the README's CI badge can describe `main`:
  # pull_request runs attach to the PR head branch, never to the default
  # branch, so a PR-only workflow renders a permanent "no status" badge.
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime deps
        run: python -m pip install --quiet pyyaml
      - name: Git identity for repo-fixture tests
        run: |
          git config --global user.email "ci@ci"
          git config --global user.name "ci"
          git config --global init.defaultBranch main
      - name: Validate declared data
        run: python -m harness.schema
      - name: Line budget + duplication sweep
        run: python tools/budget_check.py
      - name: Test suite
        run: python -m unittest discover -s tests -v
